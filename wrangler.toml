# wrangler.toml

name = "worker-wandering-rain-01aa"
main = "src/index.ts"
compatibility_date = "2026-03-01"

# 使用免费套餐并通过 workers.dev 访问时可保持默认（workers_dev=true）。
# 如需绑定自定义域名，请在 Cloudflare 面板添加 Route，或在此处配置 route/routes（示例见下方注释）。
# 参考：https://developers.cloudflare.com/workers/wrangler/configuration/

# workers_dev = true
# route = { pattern = "example.com/*", zone_name = "example.com" }
# routes = [
#   { pattern = "www.example.com/*", zone_name = "example.com" },
#   { pattern = "api.example.com/*",  zone_name = "example.com" }
# ]

[observability]
# Explicitly disable Observability to avoid Logpush/script-settings calls on free plans
enabled = false

[vars]
# ORDS 地址与应用用户可公开配置；数据库密码仅以 Worker Secret 保存。
ORDS_BASE_URL = "https://G29F77F992EEE40-DB534404.adb.ap-osaka-1.oraclecloudapps.com/ords"
ORDS_SCHEMA_PATH = "wwr"
ORDS_API_PATH = "colorevents"
DB_USER = "WWR_APP"

[placement]
# 让处理 HTTP 请求的 Worker 尽量靠近美国 ADB 的 ORDS 终结点。
# 这是一项延迟优化提示，不是数据驻留保证；Cron 不受该提示约束。
hostname = "G29F77F992EEE40-DB534404.adb.ap-osaka-1.oraclecloudapps.com"

[triggers]
# Cloudflare Cron 按 UTC 解释，每 6 小时执行一次保活
crons = ["0 */6 * * *"]

[[analytics_engine_datasets]]
binding = "AE"
dataset = "wwr-ae"

# DB_PASSWORD 必须作为 Secret 设置，例如通过 `npx wrangler secret put DB_PASSWORD`
